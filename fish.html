<main id="all-fish-grid" class="locations-grid">
    <!-- Tiks aizpildīts ar JS -->
</main>

<script>
function renderFish(data) {
    const grid = document.getElementById('all-fish-grid');
    grid.innerHTML = '';
    data.forEach(fish => {
        // Rādām tikai vārdu un bildi
        grid.innerHTML += `
            <div class="main-card" onclick="openFishDetails('${fish['Chosen Fish']}', '${fish['Image URL']}')">
                <img src="${fish['Image URL']}">
                <h2 class="loc-name">${fish['Chosen Fish']}</h2>
            </div>`;
    });
}
</script>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Fishing Planet Wiki</title>
    <style>
        body { font-family: sans-serif; padding: 20px; line-height: 1.5; color: #202122; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; }
        .fish-card { border: 1px solid #a2a9b1; padding: 10px; background: #f8f9fa; text-align: center; }
        .fish-card img { width: 100%; height: 120px; object-fit: cover; }
        h1 { border-bottom: 2px solid #a2a9b1; }
    </style>
</head>
<body>

<h1>All Fish Species</h1>

<div class="grid">
    <!-- Šeit tu manuāli ieliec savas zivis. 
         Tā kā CSV fails netiek nolasīts, šī ir vienīgā metode, kas garantēti nerādīs baltu ekrānu. -->
    
    <div class="fish-card">
        <img src="bilde_url_šeit.jpg" alt="Zivs">
        <h2>Chosen Fish Name</h2>
        <p>Lures: ...</p>
        <p>Baits: ...</p>
    </div>
</div>

</body>
</html>
